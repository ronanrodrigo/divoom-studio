name: DivoomStudio
options:
  bundleIdPrefix: dev.ronanrodrigo
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    DEVELOPMENT_TEAM: ''
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  DivoomStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - iOS
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ronanrodrigo.DivoomStudio
        PRODUCT_NAME: Divoom Studio
        PRODUCT_MODULE_NAME: DivoomStudio
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../Frameworks'
    dependencies:
      - sdk: IOBluetooth.framework
      - sdk: AppKit.framework
      - sdk: ImageIO.framework
  DivoomStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - iOS
          - iOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ronanrodrigo.DivoomStudioTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Divoom Studio.app/Contents/MacOS/Divoom Studio'
        BUNDLE_LOADER: '$(TEST_HOST)'
    dependencies:
      - target: DivoomStudio
  DivoomStudioMobile:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Sources/iOS
      - path: Sources/Protocol
      - path: Sources/Dashboard/DashboardRenderer.swift
      - path: Sources/Dashboard/WeatherService.swift
      - path: Sources/Editor/PixelProject.swift
      - path: Resources/MobileAssets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ronanrodrigo.DivoomStudioMobile
        PRODUCT_NAME: Divoom Studio
        PRODUCT_MODULE_NAME: DivoomStudioMobile
        INFOPLIST_FILE: Mobile-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: 'Apple Development'
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
  DivoomStudioMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Tests/iOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ronanrodrigo.DivoomStudioMobileUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: 'Apple Development'
    dependencies:
      - target: DivoomStudioMobile
  DivoomStudioMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Tests
        excludes:
          - iOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ronanrodrigo.DivoomStudioMobileTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: 'Apple Development'
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Divoom Studio.app/Divoom Studio'
        BUNDLE_LOADER: '$(TEST_HOST)'
    dependencies:
      - target: DivoomStudioMobile
schemes:
  DivoomStudio:
    build:
      targets:
        DivoomStudio: all
        DivoomStudioTests: [test]
    test:
      targets:
        - DivoomStudioTests
    run:
      config: Debug
  DivoomStudioMobile:
    build:
      targets:
        DivoomStudioMobile: all
        DivoomStudioMobileTests: [test]
        DivoomStudioMobileUITests: [test]
    test:
      targets:
        - DivoomStudioMobileTests
        - DivoomStudioMobileUITests
    run:
      config: Debug
